tours:
  - id: logs
    title: Dynamic Log Filtering
    subtitle: Ready to see how it works?
    buttonText: Fire it up
    steps:
      - id: introduction
        title: Let's set the stage
        substeps:
          - id: introduction_a
            title: Meet Dynamic Log Filtering
            content: 
              items: 
                - text: "Big bills? Not cool. Dynamic Log Filtering helps you slash up to 90% of your Datadog or New Relic spend. Here’s how, in three painless steps."
          - id: introduction_b
            title: This is a consolidated experience
            content:
              title: Consolidated tools
              variant: list
              items:
                - text: Multiple tools in one unified view--making it easy to see how MyDecisive works.
                - highlightText: 
                    text: "IDE Simulator:"
                    simulator: "config"
                  text: Tweak and control SmartHub through its config files.
                  variant: list
                - highlightText: 
                    text: "Terminal Simulator:"
                    simulator: terminal
                  text: Deploy changes to SmartHub like a pro.
                  variant: list
                - highlightText: 
                    text: "Status Simulator:"
                    simulator: status
                  text: Keep an eye on running SmartHub processes and components.
                  variant: list  
                - highlightText: 
                    text: "Tail logs Simulator:"
                    simulator: logs
                  text: Watch SmartHub's logs stream by in real time.
                  variant: list
                - text: You can also navigate through the steps with your left and right arrow keys.

      - id: step1
        title: "Step 1: Get the data flowing"
        substeps:
          - id: step1_a
            title: Generate synthethic log data
            content:
              items:
                - text: We'll start the synthetic services in our K8S cluster. This will generate the data we need to use, as the MyDecisive SmartHub is currently running but idle (see  Window).
                - text: "./mdai-kind.sh logs"
                  variant: code
                - text: and then
                - text: "helm upgrade --install --repo https://fluent.github.io/helm-charts fluent fluentd -f ./synthetics/loggen_fluent_config.yaml"
                  variant: code
                - text: to open the floodgates.
                - text: Next, we start Fluentd containers to stream logs from services like "service1234" and "service4321.” The Status window will confirm the container start, and the Tail Logs window will show the incoming log data.
          - id: step1_b
            visualizationModal: true
            content: 
              title: See the results!
              items: 
                - text: "Data’s flowing. Note that everything coming in from FluentD goes out to your observability vendor. There is no filtering going on. Next stop: Let’s save you some serious money."
                  src: ../../assets/logs-example.mp4
                  alt: Logs Visualization

      - id: step2
        title: "Step 2: Drop unwanted data"
        substeps:
          - id: step2_a
            title: Configure static filters
            content: 
              items: 
                - text: In line 78 of the OTEL_REF.YAML file, you define a rule that says drop logs from “service4321”.
                - text: In line 100 you enable this filter rule.
                - text: We are now actively dropping all logs from service4321, which saves you money. The downside is that this approach uses basic, static OTEL, which is suboptimal.
          - id: step2_b
            title: Static Filtration is online!
            content: 
              items: 
                - text: You’re now running OTEL and K8S like a devops boss. Service4321 is being filtered out but let’s do better.
          - id: step2_c
            title: Explore the running system
            content: 
              title: Your data, your rules
              items: 
                - text: We only edited the OTEL configuration, and MyDecisive's SmartHub automatically deployed the new logic. The cluster also adjusted to support the new pipelines without losing any data.
          - id: step2_d
            visualizationModal: true
            content: 
              title: Nice work on the filters!
              items: 
                - text: You are cutting down the noise big-time. One hitch--Service4321 are missing from Datadog. Don’t worry, we’ll get it right together.
                  src: ../../assets/filter-example.mp4
                  alt: Prefilter Visualization

      - id: step3
        title: "Step 3: Dynamic OTEL → Power-User Mode"
        substeps:
          - id: step3_a
            title: Sprinkle in some variables.
            content: 
              title: What’s happening in the config file?
              variant: list
              items: 
                - text: "We are now working with two areas in the  window: OTEL and dynamic variables."
                - text: Select HUB_REF.YAML. Line 11 defines a dynamic "noisy" service filter (replacing the static service4321 drop).
                - text: Line 49 contains the PromQL query that sets the "noisy" threshold and duration.
                - text: Check OTEL_REF.YAML (Lines 77 & 99) to see how these variables make OTEL dynamic.
                - text: "The key: The SmartHub detects log volume and configuration changes and adjusts the cluster configuration instantly to meet your budget."
                - text: This is dynamic, real-time observability control.
          - id: step3_b
            title: Kick the cluster one last time
            content: 
              title: What’s happening in the config file?
              items: 
                - text: We use a command-line tool (kubectl) to dynamically configure the system. Now, our smart central controller (SmartHub) automatically manages and adjusts the logging volume from services based on how much data they're sending, using a configurable, real-time threshold.
          - id: step3_c
            visualizationModal: true
            content:
              title: Visualize the results
              items:
                - text: null
                  src: ../../assets/dynamic-example.mp4
                  alt: Postfilter Visualization
                  
