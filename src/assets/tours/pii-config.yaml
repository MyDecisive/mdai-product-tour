  - id: "1"
    title: "Step 2: Test Redaction in Real-Time"
    subSteps:
      - id: 1-a
        title: Update manual variables
        content:
          - items:
              - text: |
                  The <emphasize>mdai-gateway</emphasize> service is the entry point to the SmartHub for live operations against the running cluster, including updates to manual variables.
          - items:
              - text: |
                  We first forward the gateway port so local requests can reach the SmartHub API.
              - text: <code>kubectl port-forward -n mdai svc/mdai-gateway 8081:8081</code>
          - items:
              - text: |
                  After that, we can send an OTTL-compatible regex and template update. The collector picks up the new redaction logic immediately, and the logs show credit card data redacted on the wire.
        animation:
          - kind: "enter_command"
            simulator: "terminal"
            updates:
              - input: "kubectl port-forward -n mdai svc/mdai-gateway 8081:8081"
                outputs:
                  - "Forwarding from 127.0.0.1:8081 -> 8081"
                  - "Forwarding from [::1]:8081 -> 8081"
          - kind: "enter_command"
            simulator: "terminal"
            updates:
              - input: |
                  curl -sS -X POST \
                    -H 'Content-Type: application/json' \
                    -d \"$(printf '{\"data\":\"%s\"}' \"$transformed_cc_str\")\" \
                    'http://localhost:8081/variables/hub/mdaihub-pii/var/cc_regex'"
                outputs:
                  - |
                    {"id":"019be7b6-ad58-7e39-8c2d-129bec0c1083","name":"var.add","version":1,"timestamp":"2026-01-22T21:57:47.480933346Z","payload":"{\"variableRef\":\"cc_regex\",\"dataType\":\"string\",\"operation\":\"add\",\"data\":\"\\\\\\\\b(?:\\\\\\\\d[ -]*){11,15}(\\\\\\\\d{4})\\\\\\\\b\"}","source":"manual_variables_api","source_id":"","hub_name":"mdaihub-pii"}
          - kind: "enter_command"
            simulator: "terminal"
            updates:
              - input: |
                  curl -sS -X POST \
                    -H 'Content-Type: application/json' \
                    -d '{\"data\":\"********-****-****-$1\"}' \
                    'http://localhost:8081/variables/hub/mdaihub-pii/var/cc_template'"
                outputs:
                  - |
                    {"id":"019be7b7-6a34-73e6-8f39-fc202df63fac","name":"var.add","version":1,"timestamp":"2026-01-22T21:58:35.828256341Z","payload":"{\"variableRef\":\"cc_template\",\"dataType\":\"string\",\"operation\":\"add\",\"data\":\"********-****-****-$1\"}","source":"manual_variables_api","source_id":"","hub_name":"mdaihub-pii"}
          - kind: "stream"
            simulator: "logs"
            updates:
              contextName: gateway-collector-84888ddfc7
              fileName: piiRedactCollectorRedactedCCData.txt
              logFormat: multiline
              speed: 100
              duration: 2400

  - id: "2"
    title: "What's next?"
    subSteps:
      - id: 2-a
        title: Secure. Compliant. Cost-Effective.
        content:
          - items:
              - text: |
                  That's the MyDecisive difference: Catching PII at the source so it never becomes a bill or a breach. You've reclaimed your data privacy; now let's reclaim the rest of your observability stack.


