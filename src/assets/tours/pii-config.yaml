id: pii
version: 0.9.0
title: PII Redaction with MyDecisive
subtitle: Discover and redact sensitive data at scale
buttonText: Let's go
steps:
  - id: "0"
    title: "Step 1: Initialize the SmartHub"
    subSteps:
      - id: 0-a
        title: Deploying your private privacy layer
        content:
          - items:
              - text: |
                  Your <bold>MyDecisive SmartHub</bold> instance is live. In the Status Monitor, you can see the secure containers that form your Hub's architecture - the "brain" of your data privacy strategy, running entirely within your infrastructure.”

              - text: |

                  To begin redacting PII, we define a pair of manual SmartHub variables in <code>hub-single-var.yaml</code>These variables control how sensitive data is detected and transformed before it leaves your cloud.
              - text: |

                  Note that these variables are manual, defined on <button:0>line 13</button> and <button:1>line 22</button>. In this version, <emphasize>you</emphasize> manage the values directly, while the SmartHub applies them to the live pipeline.
                actions:
                  - kind: "scroll_to"
                    waitForComplete: false
                    simulator: "config"
                    updates:
                      fileName: hub-single-var.yaml
                      line: 14
                      scrollOnly: true
                  - kind: "scroll_to"
                    waitForComplete: false
                    simulator: "config"
                    updates:
                      fileName: hub-single-var.yaml
                      line: 23
                      scrollOnly: true
        initialState:
          config:
            files:
              - url: "https://github.com/MyDecisive/mdai-labs/blob/2ed0b992468072e44917739755f5bc4a34517840/0.9.0/use_cases/pii/dynamic/hub-single-var.yaml"
                fileName: hub-single-var.yaml
                changes:
                  - start: 11
                    end: 18
                    changeLines: []
                  - start: 20
                    end: 27
                    changeLines: []
          status:
            - namespace: mdai
              name: prometheus-kube-prometheus-stack-prometheus-0
              noSuffix: true
            - namespace: mdai
              name: opentelemetry-operator-744c8c4b5
            - namespace: mdai
              name: mdai-valkey-primary-0
              noSuffix: true
            - namespace: mdai
              name: mdai-prometheus-node-exporter
            - namespace: mdai
              name: mdai-operator-controller-manager-554b6b7cb8
            - namespace: mdai
              name: mdai-nats-box-6d8bb549dc
            - namespace: mdai
              name: mdai-nats-2
              noSuffix: true
            - namespace: mdai
