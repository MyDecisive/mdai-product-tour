name: Deploy Site

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Which environment?
        options:
          - Staging
          - Prod
      rusure:
        type: choice
        description: Are you sure?
        options:
          - "no"
          - "no?"
          - "no."
          - "no!"
          - "yes"
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 23
          cache: "npm"
      - name: Build decisive app
        env:
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL }}
          VITE_GOOGLE_ANALYTICS_KEY: ${{ (github.event.inputs.environment == 'Prod' && github.event.inputs.rusure == 'yes') && vars.GTAG_PROD || vars.GTAG_STAGING }}
          VITE_DEPLOY_TARGET: ${{ (github.event.inputs.environment == 'Prod' && github.event.inputs.rusure == 'yes') && vars.SITEMAP_HOSTNAME_PROD || vars.SITEMAP_HOSTNAME_STAGING }}
          PRERENDER_ENV: ${{ (github.event.inputs.environment == 'Prod' && github.event.inputs.rusure == 'yes') && 'production' || 'staging' }}
        run: npm install && npm run build
      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - name: Deploy app build to S3 bucket
        run: aws s3 sync ./dist/ s3://${{ (github.event.inputs.environment == 'Prod' && github.event.inputs.rusure == 'yes') && vars.S3_BUCKET_PROD || vars.S3_BUCKET_STAGING }} --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ (github.event.inputs.environment == 'Prod' && github.event.inputs.rusure == 'yes') && secrets.DISTRIBUTION_ID_PROD || secrets.DISTRIBUTION_ID_STAGING }} --paths '/*'
      - name: Notify Slack on deploy to main
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "{
              \"channel\":\"$SLACK_CHANNEL_ID\",
              \"text\":\"🚀 *${{ github.repository }} deployed to production*\\n\
              • URL: <$vars.SITEMAP_HOSTNAME_PROD|Unknown URL>\\n\
              • Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\\n\
              • Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"
            }"

  notify-on-success:
    needs: build
    if: success()
    uses: MyDecisive/ci/.github/workflows/deploy-notify.yml@main
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_FE_DEPLOY_NOTIFY_URL }}
    with:
      deployed-url: ${{ (github.event.inputs.environment == 'Prod' && github.event.inputs.rusure == 'yes') && vars.SITEMAP_HOSTNAME_PROD || vars.SITEMAP_HOSTNAME_STAGING }}

  notify-on-failure:
    needs: build
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: MyDecisive/ci/.github/workflows/slack-notify.yml@main
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
