id: traces
version: 0.9.0
title: Dynamic Trace Filtering
buttonText: Show me
steps:
  - id: "0"
    title: "Step 1: Finish setup"
    subSteps:
      - id: 0-a
        title: Standard install to trace sampling support
        content:
          - items:
              - text: |
                  First thing in this demo is to set up some Kubernetes load balancing resources.
                  The first command: <code>kubectl apply -f ./0.9.0/use_cases/tail_sampling/k8s_rbac.yaml</code>adds role binding for the load balancer.
                  The second command: <code>kubectl create rolebinding loadbalancer-endpointslices-reader -n mdai --role=loadbalancer-endpointslices-reader --serviceaccount=mdai:loadbalancer</code>creates the load-balancing resources.
                  And the third command: <code>mdai apply ./0.9.0/use_cases/tail_sampling/scrape_trace_count_metrics.yaml</code>creates a scrape job that will get telemetry data to the metrics store.
                  The scrape job creates a custom metric called <code>trace_span_service_count_total</code>it will come into play later in the demo.
        initialState:
          status:
            - name: alertmanager-kube-prometheus-stack-alertmanager-0
              namespace: mdai
              noSuffix: true
            - name: kube-prometheus-stack-operator-6b9bcb8467
              namespace: mdai
            - name: mdai-event-hub-55cc8bcb67
              namespace: mdai
            - name: mdai-gateway-7cf67b66f7
              namespace: mdai
            - name: mdai-grafana-7b445f858c
              namespace: mdai
            - name: mdai-kube-state-metrics-f6c7956f7
              namespace: mdai
            - name: mdai-nats-0
              namespace: mdai
              noSuffix: true
            - name: mdai-nats-1
              namespace: mdai
              noSuffix: true
            - name: mdai-nats-2
              namespace: mdai
              noSuffix: true
            - name: mdai-nats-box-d7fd99784
              namespace: mdai
            - name: mdai-operator-controller-manager-6c8d6d665d
              namespace: mdai
            - name: mdai-prometheus-node-exporter
              namespace: mdai
            - name: opentelemetry-operator-5f56b69cc7
              namespace: mdai
            - name: mdai-valkey-primary-0
              namespace: mdai
              noSuffix: true
            - name: prometheus-kube-prometheus-stack-prometheus-0
              namespace: mdai
              noSuffix: true
        animation:
          - kind: enter_command
            simulator: terminal
            updates:
              - input: kubectl apply -f ./0.9.0/use_cases/tail_sampling/k8s_rbac.yaml
                outputs:
                  - role.rbac.authorization.k8s.io/loadbalancer-endpointslices-reader created
                  - rolebinding.rbac.authorization.k8s.io/loadbalancer-rolebinding created
                  - role.rbac.authorization.k8s.io/loadbalancer-role created
                  - serviceaccount/loadbalancer created
          - kind: enter_command
            simulator: terminal
            updates:
              - input: |
                  kubectl create rolebinding loadbalancer-endpointslices-reader \
                    -n mdai \
                    --role=loadbalancer-endpointslices-reader \
                    --serviceaccount=mdai:loadbalancer
                outputs:
                  - rolebinding.rbac.authorization.k8s.io/loadbalancer-endpointslices-reader created
          - kind: enter_command
            simulator: terminal
            updates:
              - input: kubectl apply -f ./0.9.0/use_cases/tail_sampling/scrape_trace_count_metrics.yaml
                outputs:
                  - scrapeconfig.monitoring.coreos.com/scrape-trace-count-metrics created
      - id: 0-b
        title: Start the flow
        content:
          - items:
              - text: Using the <emphasize>mdai CLI</emphasize>, a bare bones OTel config is used to spin up an OTel collector. The workflow we're using here also spins up some cronjobs to simulate traces.
        animation:
          - kind: enter_command
            simulator: terminal
            updates:
              - input: mdai use_case tail_sampling --version 0.9.0 --workflow basic
                outputs:
                  - "✅ Prerequisites OK"
                  - "👉 use-case 'tail_sampling': resolved data file: ./mock-data/tail_sampling.yaml"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/tail_sampling/basic/otel.yaml -n mdai"
                  - "opentelemetrycollector.opentelemetry.io/trace-balancer created"
                  - "opentelemetrycollector.opentelemetry.io/gateway created"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/tail_sampling/basic/hub.yaml -n mdai"
                  - "Warning: variables are not specified"
                  - "Warning: no `PrometheusAlerts` provided; MdaiHub will not setup alerts"
                  - "Warning: no `Rules` provided; MdaiHub will perform no actions"
                  - "mdaihub.hub.mydecisive.ai/mdaihub-ts created"
                  - "+ kubectl  apply -f ./mock-data/tail_sampling.yaml -n synthetics"
                  - "cronjob.batch/job-1 created"
                  - "cronjob.batch/job-2 created"
                  - "cronjob.batch/job-3 created"
                  - "✅ use-case 'tail_sampling': applied"
          - kind: add_services
            simulator: status
            updates:
              - name: trace-balancer-collector-67c9994454
                namespace: mdai
              - name: gateway-collector-8ddc9bcfd
                namespace: mdai
                replicas: 3
              - name: job-1-29493774
                namespace: synthetics
              - name: job-2-29493774
                namespace: synthetics
              - name: job-3-29493774
                namespace: synthetics
      - id: 0-c
        visualizationModal: true
        content:
          - title: Look at those traces go
            items:
              - text: |
                  TODO: get video of grafana otel dashboard for this step

                  This setup simulates a production system that receives and forwards span data to various destinations, including a vendor. There’s no sampling, so the service owner is subjected to the full cost of exporting large volumes of trace data from a cloud provider to vendor storage.
                src: filter-example.mp4
                alt: Traces Visualization
  - id: "1"
    title: "Step 2: Set static sampling rules"
    subSteps:
      - id: 1-a
        title: Static sampling processor
        content:
          - items:
              - text: You can see on <button:0>lines 117 through 136</button> that this configuration samples 10 percent of services where their operation attribute labels them as "high-volume-op". But it will only ever sample traces of services that have that attribute set.
                actions:
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 117
                      scrollOnly: true
        initialState:
          config:
            files:
              - url: https://github.com/DecisiveAI/mdai-labs/blob/1c1d765f796db64a8f8bbac10cbb00c1fc8992b7/0.9.0/use_cases/tail_sampling/static/otel.yaml
                fileName: otel.yaml
                changes:
                  - start: 109
                    end: 144
                    changeLines: []
      - id: 1-b
        title: Filter some traces
        content:
          - items:
              - text: By applying this processor with the command <code>mdai use_case tail_sampling --version 0.9.0 --workflow static</code>it gets applied to the gateway collector service.
        animation:
          - kind: enter_command
            simulator: terminal
            updates:
              - input: mdai use_case tail_sampling --version 0.9.0 --workflow static
                outputs:
                  - "✅ Prerequisites OK"
                  - "👉 use-case 'tail_sampling': resolved data file: ./mock-data/tail_sampling.yaml"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/tail_sampling/static/otel.yaml -n mdai"
                  - "opentelemetrycollector.opentelemetry.io/trace-balancer configured"
                  - "opentelemetrycollector.opentelemetry.io/gateway configured"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/tail_sampling/static/hub.yaml -n mdai"
                  - "mdaihub.hub.mydecisive.ai/mdaihub-ts unchanged"
                  - "+ kubectl  apply -f ./mock-data/tail_sampling.yaml -n synthetics"
                  - "cronjob.batch/job-1 unchanged"
                  - "cronjob.batch/job-2 unchanged"
                  - "cronjob.batch/job-3 unchanged"
                  - "✅ use-case 'tail_sampling': applied"
          - kind: add_services
            simulator: status
            updates:
              - name: gateway-collector-8ddc9bcfd
                namespace: mdai
                replicas: 1
      - id: 1-c
        visualizationModal: true
        content:
          - title: Look at those traces go
            items:
              - text: |
                  TODO: get video of grafana otel dashboard for this step

                  While this is an improvement over having no sampling, this static configuration can't adapt to the dynamic nature of production environments.
                src: filter-example.mp4
                alt: Traces Visualization
  - id: "2"
    title: "Step 3: Going dynamic"
    subSteps:
      - id: 2-a
        title: Make some SmartHub updates
        content:
          - items:
              - text: On <button:0>lines 19 through 25</button>, a variable is declared to keep track of the loudest services. And on <button:1>lines 45 through 49</button> an alert is configured to identify the loudest services.
                actions:
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: hub.yaml
                      line: 19
                      scrollOnly: true
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: hub.yaml
                      line: 45
                      scrollOnly: true
        animation:
          - kind: scroll_to
            simulator: config
            updates:
              fileName: hub.yaml
              line: 19
              scrollOnly: true
          - kind: delay
            duration: 1500
          - kind: scroll_to
            simulator: config
            updates:
              fileName: hub.yaml
              line: 45
              scrollOnly: true
        initialState:
          config:
            activeTab: hub.yaml
            files:
              - url: https://github.com/DecisiveAI/mdai-labs/blob/1c1d765f796db64a8f8bbac10cbb00c1fc8992b7/0.9.0/use_cases/tail_sampling/dynamic/hub.yaml
                fileName: hub.yaml
                changes:
                  - start: 19
                    end: 25
                    changeLines: []
                  - start: 45
                    end: 49
                    changeLines: []
              - url: https://github.com/DecisiveAI/mdai-labs/blob/1c1d765f796db64a8f8bbac10cbb00c1fc8992b7/0.9.0/use_cases/tail_sampling/dynamic/otel.yaml
                fileName: otel.yaml
                changes:
                  - start: 130
                    end: 133
                    changeLines: []
                  - start: 135
                    end: 177
                    changeLines: []
                  - start: 203
                    end: 203
                    changeLines: []
      - id: 2-b
        title: Use them in the OTel config
        content:
          - items:
              - text: <button:0>Lines 130 through 133</button> declare a memory limiter processor.
                actions:
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 130
                      scrollOnly: true
              - text: <button:0>Lines 135 through 177</button> show a vastly updated tail_sampling processor, using our SmartHub variable on <button:1>line 154</button>.
                actions:
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 135
                      scrollOnly: true
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 154
                      scrollOnly: true
              - text: And both of these processors are used on <button:0>line 203</button>
                actions:
                  - kind: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 203
                      scrollOnly: true
        animation:
          - kind: scroll_to
            simulator: config
            updates:
              fileName: otel.yaml
              line: 130
              scrollOnly: true
          - kind: delay
            duration: 1500
          - kind: scroll_to
            simulator: config
            updates:
              fileName: otel.yaml
              line: 135
              scrollOnly: true
          - kind: delay
            duration: 1500
          - kind: scroll_to
            simulator: config
            updates:
              fileName: otel.yaml
              line: 203
              scrollOnly: true
      - id: 2-c
        title: Make some SmartHub updates
        content:
          - items:
              - text: Using the mdai CLI, the changes just reviewed are applied to the current cluster. The result is intelligent filtering of traces!
        animation:
          - kind: enter_command
            simulator: terminal
            updates:
              - input: mdai use_case tail_sampling --version 0.9.0 --workflow dynamic
                outputs:
                  - "✅ Prerequisites OK"
                  - "👉 use-case 'tail_sampling': resolved data file: ./mock-data tail_sampling_dynamic.yaml"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/tail_sampling/dynamic/otel.yaml -n mdai"
                  - "opentelemetrycollector.opentelemetry.io/trace-balancer configured"
                  - "opentelemetrycollector.opentelemetry.io/gateway configured"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/tail_sampling/dynamic/hub.yaml -n mdai"
                  - "mdaihub.hub.mydecisive.ai/mdaihub-ts configured"
                  - "+ kubectl  apply -f ./mock-data/tail_sampling_dynamic.yaml -n synthetics"
                  - "cronjob.batch/service-a-low-volume created"
                  - "cronjob.batch/service-b-low-volume created"
                  - "cronjob.batch/service-c-high-volume created"
                  - "cronjob.batch/service-d-high-volume created"
                  - "✅ use-case 'tail_sampling': applied"
          - kind: add_services
            simulator: status
            updates:
              - name: gateway-collector-8ddc9bcfd
                namespace: mdai
                replicas: 1
              - name: trace-balancer-collector-7d5dc5985b
                namespace: mdai
              - name: service-a-low-volume-29493797
                namespace: synthetics
              - name: service-b-low-volume-29493797
                namespace: synthetics
              - name: service-c-high-volume-29493797
                namespace: synthetics
              - name: service-d-high-volume-29493797
                namespace: synthetics
      - id: 2-d
        visualizationModal: true
        content:
          - title: Look at those traces go
            items:
              - text: "TODO: get video of grafana otel dashboard for this step"
                src: filter-example.mp4
                alt: Traces Visualization
