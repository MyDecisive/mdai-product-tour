<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-white.svg" />
    <meta name="viewport" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <title>MDAI Product Tour</title>
    <!--app-robot-->
  </head>
  <body>
    <div id="root"></div>
    <script>
      var viewMode = getCookie("view-mode");
      if (viewMode == "desktop") {
        viewport.setAttribute(
          "content",
          "width=device-width",
          "initial-scale=1.0"
        );
      } else if (viewMode == "mobile") {
        viewport.setAttribute("content", "width=1000", "initial-scale=1.0");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
