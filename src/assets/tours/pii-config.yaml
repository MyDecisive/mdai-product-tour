              logFormat: json
              speed: 300
              duration: 4200
      - id: 0-b
        title: Scaling observability without the overhead.
        content:
          - items:
              - text: |
                  The SmartHub manages the OpenTelemetry collector for you, which removes much of the setup and operational work normally required to run OTEL at scale.
                actions:
                  - kind: "scroll_to"
                    waitForComplete: false
                    simulator: "config"
                    updates:
                      fileName: otel-single-var.yaml
                      line: 42
                      scrollOnly: true
                  - kind: "scroll_to"
                    waitForComplete: false
                    simulator: "config"
                    updates:
                      fileName: otel-single-var.yaml
                      line: 48
                      scrollOnly: true
        initialState:
