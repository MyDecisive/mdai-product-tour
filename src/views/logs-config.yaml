id: logs
version: 0.9.0
title: Dynamic Log Filtering
subtitle: Ready to see how it works?
buttonText: Fire it up
default_open: true
steps:
  - id: "0"
    title: Let's set the stage
    subSteps:
      - id: 0-a
        title: This is a consolidated experience
        animation:
          - type: activate
            simulator: config
            duration: 1500
          - type: activate
            simulator: terminal
            duration: 1500
          - type: activate
            simulator: status
            duration: 1500
          - type: activate
            simulator: logs
            duration: 1500
        content:
          - title: Consolidated tools
            items:
              - text: Multiple tools in one unified view--making it easy to see how MyDecisive works.
          - variant: list
            items:
              - bullet: "1."
                text: <highlight:config>IDE Simulator:</highlight> Tweak and control SmartHub through its config files
              - text: <highlight:terminal>Terminal Simulator:</highlight> Deploy changes to SmartHub like a pro
                bullet: "2."
              - bullet: "3."
                text: <highlight:status>Status Simulator:</highlight> Keep an eye on running SmartHub processes and components
              - bullet: "4."
                text: <highlight:logs>Tail logs Simulator:</highlight> Watch SmartHub's logs stream by in real time
          - items:
              - text: You can also navigate through the steps with your left and right arrow keys.
      - id: 0-b
        title: Meet Dynamic Log Filtering
        content:
          - items:
              - text: "Big bills? Not cool. Dynamic Log Filtering helps you slash up to 90% of your Datadog or New Relic spend. Here’s how, in three painless steps."

  - id: "1"
    title: "Step 1: Get the data flowing"
    subSteps:
      - id: 1-a
        title: Generate synthethic log data
        content:
          - items:
              - text: |
                  We'll start the synthetic services in our K8S cluster. This will generate the data we need to use, as the MyDecisive SmartHub is currently running but idle (see <button:0>Status</button> window). <code>./mdai-kind.sh logs</code>and then <code>helm upgrade --install --repo https://fluent.github.io/helm-charts fluent fluentd -f ./synthetics/loggen_fluent_config.yaml</code>to open the floodgates.

                  Next, we start Fluentd containers to stream logs from services like "service1234" and "service4321.” The <button:1>Status</button> window will confirm the container start, and the <button:2>Tail Logs</button> window will show the incoming log data.

                actions:
                  - type: activate
                    simulator: status
                  - type: activate
                    simulator: status
                  - type: activate
                    simulator: logs
        initialState:
          status:
            - namespace: "mdai"
              name: "prometheus-kube-prometheus-stack-prometheus-0"
              noSuffix: true
            - namespace: "mdai"
              name: "opentelemetry-operator-744c8c4b5"
            - namespace: "mdai"
              name: "mdai-valkey-primary-0"
              noSuffix: true
            - namespace: "mdai"
              name: "mdai-s3-logs-reader-5dbdc65fcc"
            - namespace: "mdai"
              name: "mdai-prometheus-node-exporter"
            - namespace: "mdai"
              name: "mdai-operator-controller-manager-65955fb98b"
            - namespace: "mdai"
              name: "mdai-nats-box-bf684c889"
            - namespace: "mdai"
              name: "mdai-nats-0"
            - namespace: "mdai"
              name: "mdai-nats-1"
            - namespace: "mdai"
              name: "mdai-nats-2"
            - namespace: "mdai"
              name: "mdai-kube-state-metrics-6cd9fd8458"
            - namespace: "mdai"
              name: "mdai-gateway-5df8b6f749"
            - namespace: "mdai"
              name: "mdai-event-hub-556c8897f5"
            - namespace: "mdai"
              name: "kube-prometheus-stack-operator-6cfdc788d4"
            - namespace: "mdai"
              name: "alertmanager-kube-prometheus-stack-alertmanager-0"
              noSuffix: true
          banner:
            text: Start log filtration to see results
            logsSent: 0
            logsFiltered: 0
        animation:
          - type: enter_command
            simulator: terminal
            updates:
              # TODO: allow outputs only terminal commands & break this frame up with
              #       smaller add_services frames
              - input: "mdai use-case data_filtration --version 0.9.0 --workflow basic"
                outputs:
                  - "^700✅ Prerequisites OK"
                  - "^450👉 use-case 'data_filtration': resolved data file: ./mock-data/data_filtration.yaml"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/data_filtration/basic/otel.yaml -n mdai"
                  - "^450opentelemetrycollector.opentelemetry.io/gateway created"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/data_filtration/basic/hub.yaml -n mdai"
                  - "Warning: variables are not specified"
                  - "Warning: no `PrometheusAlerts` provided; MdaiHub will not setup alerts"
                  - "Warning: no `Rules` provided; MdaiHub will perform no actions"
                  - "^600mdaihub.hub.mydecisive.ai/mdaihub-ddf created"
                  - "+ kubectl  apply -f ./mock-data/data_filtration.yaml -n mdai"
                  - "^300configmap/mdai-logger-settings created"
                  - "^900deployment.apps/mdai-logger-bundle created"
          - type: add_services
            simulator: status
            updates:
              - namespace: "mdai"
                name: "gateway-collector-64dc799dcb"
              - namespace: "synthetics"
                name: "mdai-logger-bundle-8584566955"
          - type: stream
            simulator: logs
            updates:
              logsSources:
                - serviceLogsBasic.txt
              speed: 50
              duration: 3000
          - type: enter_command
            simulator: terminal
            updates:
              - input: "helm upgrade --install --repo https://fluent.github.io/helm-charts fluent fluentd -f ./mock-data/configs/loggen_fluent.yaml"
                outputs:
                  - "Release 'fluent' does not exist. Installing it now.^450"
                  - "NAME: fluent"
                  - "LAST DEPLOYED: Thu Sep 11 10:58:12 2025"
                  - "NAMESPACE: default"
                  - "STATUS: deployed"
                  - "REVISION: 1"
                  - "NOTES:^850"
                  - "Get Fluentd build information by running these commands:"

                  - "export POD_NAME=$(kubectl get pods --namespace default -l 'app.kubernetes.io/name=fluentd,app.kubernetes.io/instance=fluent' -o jsonpath='{.items[0].metadata.name}')"
                  - "kubectl --namespace default port-forward $POD_NAME 24231:24231"
                  - "curl http://127.0.0.1:24231/metrics"
          - type: add_services
            simulator: status
            updates:
              - name: "fluent-fluentd"
          - type: clear
            simulators:
              - logs
            waitForComplete: false
          - type: stream
            simulator: logs
            updates:
              logsSources:
                - fluentLogsBasic.txt
              speed: 50
              duration: 3000
      - id: 1-b
        visualizationModal: true
        content:
          - title: See the results!
            items:
              - text: "Data’s flowing. Note that everything coming in from FluentD goes out to your observability vendor. There is no filtering going on. Next stop: Let’s save you some serious money."
                src: logs-example.mp4
                alt: Logs Visualization

  - id: "2"
    title: "Step 2: Drop unwanted data"
    subSteps:
      - id: 2-a
        title: Configure static filters
        content:
          - variant: list
            items:
              - text: In <emphasize>line 39</emphasize> of the OTEL.YAML file, you define a rule that says drop logs from “service4321”.
                onClick:
                  type: scroll_to
                  simulator: config
                  updates:
                    fileName: otel.yaml
                    line: 39
              - text: In <emphasize>line 65</emphasize> you enable this filter rule.
                onClick:
                  type: scroll_to
                  simulator: config
                  updates:
                    fileName: otel.yaml
                    line: 65
              - text: We are now actively dropping all logs from service4321, which saves you money. The downside is that this approach uses basic, static OTEL, which is suboptimal.
        initialState:
          config:
            files:
              - url: "https://github.com/DecisiveAI/mdai-labs/blob/cd59716b7e782854c5c9f56ab54c60947717c89d/0.9.0/use_cases/data_filtration/static/otel.yaml"
                fileName: otel.yaml
                changes:
                  - start: 39
                    end: 43
                    changeLines:
                      - "#      filter/static-non-crit-services:"
                      - "#        error_mode: ignore"
                      - "#        logs:"
                      - "#          log_record:"
                      - '#            - ''IsMatch(attributes["mdai_service"], "service1|service1234") and IsMatch(attributes["level"], "INFO|DEBUG|WARN")'''
                  - start: 65
                    end: 65
                    changeLines:
                      - "#            filter/static-non-crit-services,"
            activeTab: otel.yaml
          status:
            - namespace: "mdai"
              name: "gateway-collector"
              replicas: 5
          banner:
            text: of log data filtered
            logsFiltered: 0
            logsSent: 28.5
        animation:
          - type: scroll_to
            simulator: config
            updates:
              fileName: otel.yaml
              line: 39
          - type: delay
            duration: 1500
          - type: scroll_to
            simulator: config
            updates:
              fileName: otel.yaml
              line: 65
          - type: delay
            duration: 1500
          - type: enter_command
            simulator: terminal
            updates:
              - input: "mdai use_case data_filtration --version 0.9.0 --workflow static"
                outputs:
                  - "^700✅ Prerequisites OK"
                  - "^450👉 use-case 'data_filtration': resolved data file: ./mock-data/data_filtration.yaml"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/data_filtration/static/otel.yaml -n mdai"
                  - "^450opentelemetrycollector.opentelemetry.io/gateway configured"
                  - "+ kubectl  apply -f ./0.9.0/use_cases/data_filtration/static/hub.yaml -n mdai"
                  - "Warning: variables are not specified"
                  - "Warning: no `PrometheusAlerts` provided; MdaiHub will not setup alerts"
                  - "Warning: no `Rules` provided; MdaiHub will perform no actions"
                  - "^600mdaihub.hub.mydecisive.ai/mdaihub-compliance created"
                  - "+ kubectl  apply -f ./mock-data/data_filtration.yaml -n synthetics"
                  - "configmap/mdai-logger-settings unchanged"
                  - "^300deployment.apps/mdai-logger-bundle unchanged"
                  - "^900✅ use-case 'data_filtration': applied"
          - type: add_services
            simulator: status
            updates:
              - namespace: "mdai"
                name: "gateway-collector"
                replicas: 5
          - type: update
            simulator: banner
            updates:
              text: of log data filtered
              logsSent: 3.99
              logsFiltered: 24.51
            waitForComplete: false
          - type: stream
            simulator: logs
            updates:
              logsSources:
                - collectorLogs.txt
              speed: 85
              duration: 3000
      - id: 2-b
        title: Static Filtration is online!
        content:
          - items:
              - text: You’re now running OTEL and K8S like a devops boss. Service4321 is being filtered out but let’s do better
      - id: 2-c
        title: The big deal?
        content:
          - title: Your data, your rules
            items:
              - text: We only edited the OTEL configuration, and MyDecisive's SmartHub automatically deployed the new logic. The cluster also adjusted to support the new pipelines without losing any data.
      - id: 2-d
        visualizationModal: true
        content:
          - title: Nice work on the filters!
            items:
              - text: You are cutting down the noise big-time. One hitch--Service4321 is missing from Datadog. Don’t worry, we’ll get it right together.
                src: filter-example.mp4
                alt: Prefilter Visualization

  - id: "3"
    title: "Step 3: Dynamic OTEL → Power-User Mode"
    subSteps:
      - id: 3-a
        title: Sprinkle in some variables
        content:
          - title: What’s happening in the config file?
            variant: list
            items:
              - bullet: "1."
                text: "We are now working with two areas in the <button:0>Config</button> window: OTEL and dynamic variables."
                actions:
                  - type: activate
                    simulator: config
              - bullet: "2."
                text: 'Select HUB.YAML. <button:0>Line 11</button> defines a dynamic "noisy" service filter (replacing the static service4321 drop).'
                actions:
                  - type: scroll_to
                    simulator: config
                    updates:
                      fileName: hub.yaml
                      line: 11

              - bullet: "3."
                text: '<button:0>Line 49</button> contains the PromQL query that sets the "noisy" threshold and duration.'
                actions:
                  - type: scroll_to
                    simulator: config
                    updates:
                      fileName: hub.yaml
                      line: 49
              - bullet: "4."
                text: "Check OTEL.YAML (Lines <button:0>54</button> & <button:1>99</button>) to see how these variables make OTEL dynamic."
                actions:
                  - type: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 54
                  - type: scroll_to
                    simulator: config
                    updates:
                      fileName: otel.yaml
                      line: 99
              - bullet: "5."
                text: "The key: The SmartHub detects log volume and configuration changes and adjusts the cluster configuration instantly to meet your budget."
          - text: This is dynamic, real-time observaility control.
        initialState:
          config:
            files:
              - url: "https://github.com/DecisiveAI/mdai-labs/blob/cd59716b7e782854c5c9f56ab54c60947717c89d/0.9.0/use_cases/data_filtration/dynamic/hub.yaml"
                fileName: hub.yaml
                changes:
                  - start: 11
                    end: 17
                    changeLines: []
                  - start: 30
                    end: 34
                    changeLines: []
                  - start: 50
                    end: 63
                    changeLines: []
              - url: "https://github.com/DecisiveAI/mdai-labs/blob/cd59716b7e782854c5c9f56ab54c60947717c89d/0.9.0/use_cases/data_filtration/dynamic/otel.yaml"
                fileName: otel.yaml
                changes:
                  - start: 43
                    end: 54
                    changeLines:
                      - "     # SWAP OUT FOR THE"
                      - "       filter/static-non-crit-services:"
                      - "         error_mode: ignore"
                      - "         logs:"
                      - "           log_record:"
                      - '             - ''IsMatch(attributes["mdai_service"], "service1|service2")'''
                      - ""
                      - "     # filter/dynamic-non-crit-services:"
                      - "     #   error_mode: ignore"
                      - "     #   logs:"
                      - "     #     log_record:"
                      - '     #       - ''"${env:SERVICE_LIST_REGEX}" != "" and IsMatch(attributes["mdai_service"], "${env:SERVICE_LIST_REGEX}")'''
                  - start: 98
                    end: 99
                    changeLines:
                      - "          filter/static-non-crit-services,"
                      - "          # filter/dynamic-non-crit-services,"
            activeTab: hub.yaml
          status:
            - namespace: "mdai"
              name: "mdai-operator-controller-manager-65955fb98b"
            - namespace: "mdai"
              name: "gateway-collector"
              replicas: 5
          banner:
            - text: of log data filtered
              logsFiltered: 24.51
              logsSent: 3.99
        animation:
          - type: scroll_to
            simulator: config
            updates:
              line: 11
              fileName: hub.yaml
          - type: delay
            duration: 1500
          - type: scroll_to
            simulator: config
            updates:
              line: 30
              fileName: hub.yaml
          - type: delay
            duration: 1500
          - type: scroll_to
            simulator: config
            updates:
              line: 50
              fileName: hub.yaml
          - type: delay
            duration: 1500
          - type: scroll_to
            simulator: config
            updates:
              line: 43
              fileName: otel.yaml
          - type: delay
            duration: 1500
          - type: scroll_to
            simulator: config
            updates:
              line: 98
              fileName: otel.yaml
          - type: delay
            duration: 1500
      - id: 3-b
        title: Kick the cluster one last time
        content:
          - items:
              - text: "We use a command-line tool (kubectl) to dynamically configure the system. Now, our smart central controller (SmartHub) automatically manages and adjusts the logging volume from services based on how much data they're sending, using a configurable, real-time threshold."
        animation:
          - type: enter_command
            simulator: terminal
            updates:
              - input: "kubectl apply -f mdai/hub/ref.yaml"
                outputs:
                  - "^450mdaihub.hub.mydecisive.ai/mdaihub-sample configured"
          - type: add_services
            simulator: status
            updates:
              - namespace: "mdai"
                name: "mdai-operator-controller-manager-65955fb98b"
            waitForComplete: false
          - type: enter_command
            simulator: terminal
            updates:
              - input: kubectl apply -f otel/otel.yaml
                outputs:
                  - "^450opentelemetrycollector.opentelemetry.io/gateway configured"
          - type: add_services
            simulator: status
            updates:
              - namespace: "mdai"
                name: "gateway-collector"
                replicas: 5
          - type: stream
            simulator: logs
            updates:
              logsSources:
                - serviceLogs.txt
                - noisyServiceLogs.txt
                - xtraNoisyServiceLogs.txt
              speed: 20
              duration: 800

      - id: step3_visualize
        visualizationModal: true
        content:
          title: Visualize the results
          items:
            - text: null
              src: dynamic-example.mp4
              alt: Postfilter Visualization
