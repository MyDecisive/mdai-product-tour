id: intro
version: 0.9.0
title: How to use this tour
subtitle: How To Navigate this Demo
buttonText: Show me
steps:
  - id: "0"
    title: Let's set the stage
    subSteps:
      - id: 0-a
        title: Step through our interactive demos in a familiar workspace.
        content:
          - items:
              - text: |
                   This panel explains the core concepts of each solution.
          - items:
              - text: |
                  Use the buttons below or your <bold>arrow keys</bold> to navigate.
          - items:
              - text: |
                  You can also click any <bold>heading</bold> to jump to a specific step, though we recommend following the tour in sequence for the full experience.

      - id: 0-b
        title: A Unified View
        animation:
          - kind: activate
            simulator: config
            duration: 2250
          - kind: activate
            simulator: terminal
            duration: 2250
          - kind: activate
            simulator: status
            duration: 2250
          - kind: activate
            simulator: logs
            duration: 2250
        content:
          - items:
              - text: |
                  Welcome to your unified workspace. To show you the power of <bold>MyDecisive</bold>, we've consolidated your entire workflow into a single view.

          - items:
              - text: |
                  The control panel on the right simulates your real-world environment. Use these four windows to manage your telemetry:

          - variant: list
            items:
              - bullet: "1."
                text: <highlight:config>IDE:</highlight> Fine-tune and control the SmartHub via configuration files.

              - bullet: "2."
                text: <highlight:terminal>Terminal:</highlight> Deploy your changes instantly with pro-level commands.

              - bullet: "3."
                text: <highlight:status>Process Monitor:</highlight> Track running SmartHub components and system health in real time.

              - bullet: "4."
                text: <highlight:logs>Live Tail:</highlight> Watch your logs stream by to verify your filters and redactions.

          - items:
              - text: |
                  <bold>Pro Tip</bold>: Want to see an animation again? Just hit <bold>Reset</bold>, then <bold>Play</bold>.

          - items:
              - text: |
                  <bold>Ready to move on?</bold> Advancing will return you to the home page, where you can explore our other solution tours
